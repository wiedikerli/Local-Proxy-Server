events {}

http {
    server {
        listen 443 ssl;
        server_name displayactive.ch www.displayactive.ch;

        ssl_certificate     /etc/nginx/ssl/displayactive.ch.pem;
        ssl_certificate_key /etc/nginx/ssl/displayactive.ch-key.pem;

        location / {
            proxy_pass https://host.docker.internal:44353;
            proxy_ssl_server_name on;
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Also allow HTTP → HTTPS redirect if needed
    server {
        listen 80;
        server_name displayactive.ch www.displayactive.ch;
        return 301 https://$host$request_uri;
    }
}
